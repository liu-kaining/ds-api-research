<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="905" viewBox="0 0 1200 905" role="img" aria-labelledby="title desc"><title id="title">准入是控制回路，不只是入口限流</title><desc id="desc">速率工作预算与瞬时占用租约分开；持续反馈必须有作用域、回退和本地保护。。作者参考设计或假设场景，不代表任何厂商生产拓扑、事故或能力评价。</desc><defs><marker id="arr-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183246"/></marker><marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64747b"/></marker><marker id="arr-paper" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7f6f0"/></marker><marker id="arr-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d4ddd8"/></marker><marker id="arr-D1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#246f64"/></marker><marker id="arr-D2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#356888"/></marker><marker id="arr-D3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6e7942"/></marker><marker id="arr-D4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45a35"/></marker><marker id="arr-D5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#795e7b"/></marker><marker id="arr-p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf3ee"/></marker><marker id="arr-p2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf0f5"/></marker><marker id="arr-p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f0f1e5"/></marker><marker id="arr-p4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#faeee4"/></marker><marker id="arr-p5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1eaf2"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b44935"/></marker><marker id="arr-white" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fffef9"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}svg{background:#f7f6f0}</style><rect x="0" y="0" width="1200" height="905" rx="0" fill="#f7f6f0" stroke="#f7f6f0" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="94" rx="0" fill="#183246" stroke="#183246" stroke-width="1.4"/><text x="30" y="33" font-size="13" fill="#b9cbc9" font-weight="400" text-anchor="start">FIG. 03 / RELIABILITY ARCHITECTURE</text><text x="30" y="69" font-size="27" fill="#fffef9" font-weight="500" text-anchor="start">准入是控制回路，不只是入口限流</text><text x="30" y="120" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">速率工作预算与瞬时占用租约分开；持续反馈必须有作用域、回退和本地保护。</text><rect x="30" y="155" width="350" height="151" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="45" y="186" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="39 163 332 135">请求画像</text><text x="45" y="214" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 163 332 135">输入 / 输出预算 / 任务等级</text><text x="45" y="238" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 163 332 135">状态需求 / 缓存保守估计</text><text x="45" y="262" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 163 332 135">总 deadline / 重试身份</text><rect x="425" y="155" width="350" height="151" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="440" y="186" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="434 163 332 135">两类资源账本</text><text x="440" y="214" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="434 163 332 135">速率：输入、输出、传输工作</text><text x="440" y="238" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="434 163 332 135">占用：活动槽、状态空间</text><text x="440" y="262" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="434 163 332 135">多调度器须原子预留或分租约</text><rect x="820" y="155" width="350" height="151" rx="7" fill="#fffef9" stroke="#a45a35" stroke-width="1.4"/><text x="835" y="186" font-size="19" fill="#a45a35" font-weight="500" text-anchor="start" data-fit="829 163 332 135">可信容量与反馈</text><text x="835" y="214" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="829 163 332 135">完整健康单元 / 当前代际</text><text x="835" y="238" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="829 163 332 135">工作负载下的实测曲线</text><text x="835" y="262" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="829 163 332 135">worker 本地硬上限兜底</text><rect x="440" y="380" width="340" height="114" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="455" y="411" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="449 388 322 98">预算 + 期限都允许？</text><text x="455" y="439" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="449 388 322 98">资源逐维满足，不合成万能分数</text><text x="455" y="463" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="449 388 322 98">估计不足时：补租约或按约定终止</text><path d="M205 306 L205 350 L440 350 L440 415" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><path d="M600 306 L600 376" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><path d="M995 306 L995 350 L780 350 L780 415" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)"/><rect x="835" y="390" width="335" height="105" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="850" y="421" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="844 398 317 89">执行：首次 / 重试 / 内部流量</text><text x="850" y="449" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="844 398 317 89">共同扣减实际涉及的资源预算</text><path d="M780 435 L831 435" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><text x="788" y="420" font-size="14" fill="#246f64" font-weight="400" text-anchor="start">允许</text><rect x="30" y="570" width="335" height="105" rx="7" fill="#fffef9" stroke="#a45a35" stroke-width="1.4"/><text x="45" y="601" font-size="19" fill="#a45a35" font-weight="500" text-anchor="start" data-fit="39 578 317 89">明确拒绝 / 约定降级</text><text x="45" y="629" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 578 317 89">无法在期限内完成，不无限排队</text><rect x="440" y="570" width="340" height="105" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="455" y="601" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="449 578 322 89">有界公平等待</text><text x="455" y="629" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="449 578 322 89">仍有完成价值；截止前重新判断</text><path d="M600 494 L600 566" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><path d="M440 465 L195 465 L195 566" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)"/><path d="M780 620 L800 620 L800 340 L650 340 L650 376" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)" stroke-dasharray="7 5"/><path d="M1000 495 L1000 705 L1185 705 L1185 230 L1172 230" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)"/><text x="430" y="727" font-size="17" fill="#a45a35" font-weight="500" text-anchor="start">反馈：完成率、队列斜率、阶段尾延迟、状态回收</text><rect x="30" y="780" width="1140" height="75" rx="4" fill="#eaf3ee" stroke="#246f64" stroke-width="1.4"/><text x="46" y="809" font-size="18" fill="#246f64" font-weight="500" text-anchor="start">先限制放大，再逐步恢复预算；缓存命中预测不能充当确定容量。</text><text x="46" y="835" font-size="15" fill="#64747b" font-weight="400" text-anchor="start">预热、探针、迁移、影子和重试消耗的计算/通信，也要进入同一套账本。</text><text x="30" y="886" font-size="13" fill="#64747b" font-weight="400" text-anchor="start">作者参考设计 / 教学假设 · 各机制需按实际实现验证 · 不构成厂商部署、事故或服务承诺声明</text></svg>
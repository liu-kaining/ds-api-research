<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="875" viewBox="0 0 1200 875" role="img" aria-labelledby="title desc"><title id="title">复合故障：完整单元减少，缓存又变冷</title><desc id="desc">所有数字均为教学假设；预算来自同分布测试，任何新增约束都可能降低最终准入。。作者参考设计或假设场景，不代表任何厂商生产拓扑、事故或能力评价。</desc><defs><marker id="arr-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183246"/></marker><marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64747b"/></marker><marker id="arr-paper" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7f6f0"/></marker><marker id="arr-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d4ddd8"/></marker><marker id="arr-D1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#246f64"/></marker><marker id="arr-D2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#356888"/></marker><marker id="arr-D3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6e7942"/></marker><marker id="arr-D4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45a35"/></marker><marker id="arr-D5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#795e7b"/></marker><marker id="arr-p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf3ee"/></marker><marker id="arr-p2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf0f5"/></marker><marker id="arr-p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f0f1e5"/></marker><marker id="arr-p4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#faeee4"/></marker><marker id="arr-p5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1eaf2"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b44935"/></marker><marker id="arr-white" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fffef9"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}svg{background:#f7f6f0}</style><rect x="0" y="0" width="1200" height="875" rx="0" fill="#f7f6f0" stroke="#f7f6f0" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="94" rx="0" fill="#183246" stroke="#183246" stroke-width="1.4"/><text x="30" y="33" font-size="13" fill="#b9cbc9" font-weight="400" text-anchor="start">FIG. 06 / RELIABILITY ARCHITECTURE</text><text x="30" y="69" font-size="27" fill="#fffef9" font-weight="500" text-anchor="start">复合故障：完整单元减少，缓存又变冷</text><text x="30" y="120" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">所有数字均为教学假设；预算来自同分布测试，任何新增约束都可能降低最终准入。</text><rect x="30" y="160" width="255" height="335" rx="7" fill="#eaf3ee" stroke="#246f64" stroke-width="1.4"/><text x="47" y="194" font-size="18" fill="#246f64" font-weight="500" text-anchor="start">A 正常暖态</text><text x="47" y="240" font-size="18" fill="#183246" font-weight="400" text-anchor="start">4 × 100 × 0.7</text><text x="47" y="316" font-size="49" fill="#246f64" font-weight="500" text-anchor="start">280</text><text x="47" y="345" font-size="14" fill="#64747b" font-weight="400" text-anchor="start">次尝试 / 秒的规划预算</text><text x="47" y="400" font-size="16" fill="#183246" font-weight="400" text-anchor="start">完整健康容量</text><text x="47" y="428" font-size="16" fill="#183246" font-weight="400" text-anchor="start">原始到达 200/s</text><path d="M288 330 L316 330" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><rect x="325" y="160" width="255" height="335" rx="7" fill="#eaf0f5" stroke="#356888" stroke-width="1.4"/><text x="342" y="194" font-size="18" fill="#356888" font-weight="500" text-anchor="start">B 失去一个单元</text><text x="342" y="240" font-size="18" fill="#183246" font-weight="400" text-anchor="start">3 × 100 × 0.7</text><text x="342" y="316" font-size="49" fill="#356888" font-weight="500" text-anchor="start">210</text><text x="342" y="345" font-size="14" fill="#64747b" font-weight="400" text-anchor="start">次尝试 / 秒的规划预算</text><text x="342" y="400" font-size="16" fill="#183246" font-weight="400" text-anchor="start">先隔离坏目标</text><text x="342" y="428" font-size="16" fill="#183246" font-weight="400" text-anchor="start">确认剩余就绪与版本</text><path d="M583 330 L611 330" fill="none" stroke="#356888" stroke-width="2.2" marker-end="url(#arr-D2)"/><rect x="620" y="160" width="255" height="335" rx="7" fill="#faeee4" stroke="#a45a35" stroke-width="1.4"/><text x="637" y="194" font-size="18" fill="#a45a35" font-weight="500" text-anchor="start">C 同时缓存变冷</text><text x="637" y="240" font-size="18" fill="#183246" font-weight="400" text-anchor="start">3 × 70 × 0.7</text><text x="637" y="316" font-size="49" fill="#a45a35" font-weight="500" text-anchor="start">147</text><text x="637" y="345" font-size="14" fill="#64747b" font-weight="400" text-anchor="start">次尝试 / 秒的规划预算</text><text x="637" y="400" font-size="16" fill="#183246" font-weight="400" text-anchor="start">例：新任务 140/s</text><text x="637" y="428" font-size="16" fill="#183246" font-weight="400" text-anchor="start">额外尝试最多 7/s</text><path d="M878 330 L906 330" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)"/><rect x="915" y="160" width="255" height="335" rx="7" fill="#f0f1e5" stroke="#6e7942" stroke-width="1.4"/><text x="932" y="194" font-size="18" fill="#6e7942" font-weight="500" text-anchor="start">D 单元恢复仍冷</text><text x="932" y="240" font-size="18" fill="#183246" font-weight="400" text-anchor="start">4 × 70 × 0.7</text><text x="932" y="316" font-size="49" fill="#6e7942" font-weight="500" text-anchor="start">196</text><text x="932" y="345" font-size="14" fill="#64747b" font-weight="400" text-anchor="start">次尝试 / 秒的规划预算</text><text x="932" y="400" font-size="16" fill="#183246" font-weight="400" text-anchor="start">仍低于原始 200/s</text><text x="932" y="428" font-size="16" fill="#183246" font-weight="400" text-anchor="start">不能立即全量放回</text><text x="32" y="540" font-size="17" fill="#183246" font-weight="400" text-anchor="start">C：约定工作负载与 SLO 下的实测容量上界；0.7：教学预算系数，不是 GPU 利用率。</text><rect x="30" y="580" width="550" height="120" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="45" y="611" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="39 588 532 104">速率约束仍要逐维验证</text><text x="45" y="639" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 588 532 104">首次、重试、迁移、预热共同扣预算</text><text x="45" y="663" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 588 532 104">同一尝试模型成立时才可按次数相加</text><rect x="620" y="580" width="550" height="120" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="635" y="611" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="629 588 532 104">瞬时占用仍受 worker 本地保护</text><text x="635" y="639" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="629 588 532 104">在途状态、活动槽、交接预留不能超限</text><text x="635" y="663" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="629 588 532 104">容量视图落后时，不依赖远端过时预测</text><rect x="30" y="745" width="1140" height="75" rx="4" fill="#faeee4" stroke="#a45a35" stroke-width="1.4"/><text x="46" y="774" font-size="18" fill="#a45a35" font-weight="500" text-anchor="start">单元已选主 / 进程已启动 / GPU 已分配，都不等于恢复可服务容量。</text><text x="46" y="800" font-size="15" fill="#64747b" font-weight="400" text-anchor="start">共同机架、网络、存储与控制依赖需纳入 N−k；冷态曲线不能用暖态吞吐替代。</text><text x="30" y="856" font-size="13" fill="#64747b" font-weight="400" text-anchor="start">作者参考设计 / 教学假设 · 各机制需按实际实现验证 · 不构成厂商部署、事故或服务承诺声明</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">发布不是换一个镜像，而是维护一个兼容关系</title><desc id="desc">受控回退先保证容量和状态正确；外层强杀期限应覆盖内部摘流、传播与排空预算。。作者参考设计或假设场景，不代表任何厂商生产拓扑、事故或能力评价。</desc><defs><marker id="arr-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183246"/></marker><marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64747b"/></marker><marker id="arr-paper" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7f6f0"/></marker><marker id="arr-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d4ddd8"/></marker><marker id="arr-D1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#246f64"/></marker><marker id="arr-D2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#356888"/></marker><marker id="arr-D3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6e7942"/></marker><marker id="arr-D4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45a35"/></marker><marker id="arr-D5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#795e7b"/></marker><marker id="arr-p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf3ee"/></marker><marker id="arr-p2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf0f5"/></marker><marker id="arr-p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f0f1e5"/></marker><marker id="arr-p4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#faeee4"/></marker><marker id="arr-p5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1eaf2"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b44935"/></marker><marker id="arr-white" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fffef9"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}svg{background:#f7f6f0}</style><rect x="0" y="0" width="1200" height="860" rx="0" fill="#f7f6f0" stroke="#f7f6f0" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="94" rx="0" fill="#183246" stroke="#183246" stroke-width="1.4"/><text x="30" y="33" font-size="13" fill="#b9cbc9" font-weight="400" text-anchor="start">FIG. 07 / RELIABILITY ARCHITECTURE</text><text x="30" y="69" font-size="27" fill="#fffef9" font-weight="500" text-anchor="start">发布不是换一个镜像，而是维护一个兼容关系</text><text x="30" y="120" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">受控回退先保证容量和状态正确；外层强杀期限应覆盖内部摘流、传播与排空预算。</text><rect x="30" y="155" width="1140" height="125" rx="7" fill="#f1eaf2" stroke="#795e7b" stroke-width="1.4"/><text x="48" y="188" font-size="20" fill="#795e7b" font-weight="500" text-anchor="start">兼容发布单元：记录已验证组合，明确可共享状态和回退条件</text><text x="48" y="226" font-size="18" fill="#183246" font-weight="400" text-anchor="start">权重 / Tokenizer / 模板 / 适配器 / 结构约束 / 内核与量化 / KV 布局与命名空间</text><text x="48" y="254" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">不要求每次同时升级；要求每个被放流的组合有测试与版本身份。</text><rect x="30" y="370" width="165" height="140" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="45" y="401" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="39 378 147 124">影子验证</text><text x="45" y="429" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 378 147 124">只观测，无副作用</text><path d="M195 440 L220 440" fill="none" stroke="#795e7b" stroke-width="2.2" marker-end="url(#arr-D5)"/><rect x="225" y="370" width="165" height="140" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="240" y="401" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="234 378 147 124">金丝雀</text><text x="240" y="429" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="234 378 147 124">任务族 + 冷暖分组</text><path d="M390 440 L415 440" fill="none" stroke="#795e7b" stroke-width="2.2" marker-end="url(#arr-D5)"/><rect x="420" y="370" width="165" height="140" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="435" y="401" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="429 378 147 124">逐级放量</text><text x="435" y="429" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="429 378 147 124">预算内观察长尾</text><path d="M585 440 L610 440" fill="none" stroke="#795e7b" stroke-width="2.2" marker-end="url(#arr-D5)"/><rect x="615" y="370" width="165" height="140" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="630" y="401" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="624 378 147 124">旧组摘流</text><text x="630" y="429" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="624 378 147 124">确认路由已传播</text><path d="M780 440 L805 440" fill="none" stroke="#795e7b" stroke-width="2.2" marker-end="url(#arr-D5)"/><rect x="810" y="370" width="165" height="140" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="825" y="401" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="819 378 147 124">排空 / 受限迁移</text><text x="825" y="429" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="819 378 147 124">无支持则明确中断</text><path d="M975 440 L1000 440" fill="none" stroke="#795e7b" stroke-width="2.2" marker-end="url(#arr-D5)"/><rect x="1005" y="370" width="165" height="140" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="1020" y="401" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="1014 378 147 124">确认退出</text><text x="1020" y="429" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="1014 378 147 124">无旧输出与孤儿</text><rect x="30" y="575" width="1140" height="100" rx="7" fill="#faeee4" stroke="#a45a35" stroke-width="1.4"/><text x="47" y="608" font-size="21" fill="#a45a35" font-weight="500" text-anchor="start">停止 / 回退门：冻结后续放量；当前已过载则退回已验证预算</text><text x="47" y="646" font-size="17" fill="#183246" font-weight="400" text-anchor="start">阶段尾延迟、合法终态、任务质量、旧 epoch、状态回收、依赖容量与外部副作用</text><path d="M600 575 L600 540 L420 540 L420 510" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)" stroke-dasharray="7 5"/><rect x="30" y="730" width="1140" height="75" rx="4" fill="#f1eaf2" stroke="#795e7b" stroke-width="1.4"/><text x="46" y="759" font-size="18" fill="#795e7b" font-weight="500" text-anchor="start">优雅迁移 ≠ 突然故障续写；单一有效 owner ≠ 客户端恰好一次接收。</text><text x="46" y="785" font-size="15" fill="#64747b" font-weight="400" text-anchor="start">迁移能力、结构化解码、事件重放和保留期限，都按具体端点与版本契约验收。</text><text x="30" y="841" font-size="13" fill="#64747b" font-weight="400" text-anchor="start">作者参考设计 / 教学假设 · 各机制需按实际实现验证 · 不构成厂商部署、事故或服务承诺声明</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">GPU 健康，公共依赖仍可能放大为全平台故障</title><desc id="desc">参考传播图；实线为请求/事件路径，虚线为可能共用的基础依赖；不代表厂商生产实现。。作者参考设计或假设场景，不代表任何厂商生产拓扑、事故或能力评价。</desc><defs><marker id="arr-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183246"/></marker><marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64747b"/></marker><marker id="arr-paper" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7f6f0"/></marker><marker id="arr-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d4ddd8"/></marker><marker id="arr-D1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#246f64"/></marker><marker id="arr-D2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#356888"/></marker><marker id="arr-D3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6e7942"/></marker><marker id="arr-D4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45a35"/></marker><marker id="arr-D5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#795e7b"/></marker><marker id="arr-p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf3ee"/></marker><marker id="arr-p2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf0f5"/></marker><marker id="arr-p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f0f1e5"/></marker><marker id="arr-p4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#faeee4"/></marker><marker id="arr-p5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1eaf2"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b44935"/></marker><marker id="arr-white" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fffef9"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}svg{background:#f7f6f0}</style><rect x="0" y="0" width="1200" height="1040" rx="0" fill="#f7f6f0" stroke="#f7f6f0" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="94" rx="0" fill="#183246" stroke="#183246" stroke-width="1.4"/><text x="30" y="33" font-size="13" fill="#b9cbc9" font-weight="400" text-anchor="start">FIG. 09 / RELIABILITY ARCHITECTURE</text><text x="30" y="69" font-size="27" fill="#fffef9" font-weight="500" text-anchor="start">GPU 健康，公共依赖仍可能放大为全平台故障</text><text x="30" y="120" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">参考传播图；实线为请求/事件路径，虚线为可能共用的基础依赖；不代表厂商生产实现。</text><rect x="30" y="150" width="1140" height="110" rx="7" fill="#faeee4" stroke="#a45a35" stroke-width="1.4"/><text x="45" y="181" font-size="19" fill="#a45a35" font-weight="500" text-anchor="start" data-fit="39 158 1122 94">可能的共同故障域</text><text x="45" y="209" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 158 1122 94">同一存储集群、网络、证书/密钥服务或配置发布，可能同时影响多个公共服务</text><text x="45" y="233" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 158 1122 94">实际是否共用，以运行依赖图与故障注入为准；虚线表示可能的共同依赖</text><path d="M157 260 L157 316" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)" stroke-dasharray="7 5"/><rect x="30" y="320" width="255" height="125" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="45" y="351" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="39 328 237 109">鉴权 / 授权</text><text x="45" y="379" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 328 237 109">超时与权限拒绝分开</text><text x="45" y="403" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 328 237 109">本地判定须有有效边界</text><path d="M452 260 L452 316" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)" stroke-dasharray="7 5"/><rect x="325" y="320" width="255" height="125" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="340" y="351" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="334 328 237 109">租户额度 / 预算</text><text x="340" y="379" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="334 328 237 109">未知提交先查询对账</text><text x="340" y="403" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="334 328 237 109">旧、新可消费额度共账</text><path d="M747 260 L747 316" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)" stroke-dasharray="7 5"/><rect x="620" y="320" width="255" height="125" rx="7" fill="#fffef9" stroke="#a45a35" stroke-width="1.4"/><text x="635" y="351" font-size="19" fill="#a45a35" font-weight="500" text-anchor="start" data-fit="629 328 237 109">配置 / 发现 / 状态</text><text x="635" y="379" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="629 328 237 109">快照、代际、权威状态</text><text x="635" y="403" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="629 328 237 109">主已选出还要验证就绪</text><path d="M1042 260 L1042 316" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)" stroke-dasharray="7 5"/><rect x="915" y="320" width="255" height="125" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="930" y="351" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="924 328 237 109">usage / 计量</text><text x="930" y="379" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="924 328 237 109">持久化、去重、信用</text><text x="930" y="403" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="924 328 237 109">缓冲与补账都要有界</text><rect x="30" y="555" width="255" height="90" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="45" y="586" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="39 563 237 74">入口 / 租户识别</text><text x="45" y="614" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 563 237 74">实际请求主链</text><path d="M285 600 L320 600" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><path d="M157 445 L157 551" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><rect x="325" y="555" width="255" height="90" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="340" y="586" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="334 563 237 74">准入 / 有界队列</text><text x="340" y="614" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="334 563 237 74">实际请求主链</text><path d="M580 600 L615 600" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><path d="M452 445 L452 551" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><rect x="620" y="555" width="255" height="90" rx="7" fill="#fffef9" stroke="#a45a35" stroke-width="1.4"/><text x="635" y="586" font-size="19" fill="#a45a35" font-weight="500" text-anchor="start" data-fit="629 563 237 74">调度 / 选路</text><text x="635" y="614" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="629 563 237 74">实际请求主链</text><path d="M875 600 L910 600" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)"/><path d="M747 445 L747 551" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)"/><rect x="915" y="555" width="255" height="90" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="930" y="586" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="924 563 237 74">推理 / 流输出</text><text x="930" y="614" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="924 563 237 74">实际请求主链</text><path d="M1042 555 L1042 449" fill="none" stroke="#795e7b" stroke-width="2.2" marker-end="url(#arr-D5)"/><text x="1057" y="501" font-size="15" fill="#795e7b" font-weight="400" text-anchor="start">计量事件</text><rect x="30" y="725" width="550" height="140" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="45" y="756" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="39 733 532 124">入口与状态修改：必须知道能信任什么</text><text x="45" y="784" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 733 532 124">授权、预算、旧快照各自设置有效边界</text><text x="45" y="808" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 733 532 124">状态不可信时，停止相应新增或所有权转移</text><text x="45" y="832" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 733 532 124">已有健康流能否继续，由预先验证的条件决定</text><rect x="620" y="725" width="550" height="140" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="635" y="756" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="629 733 532 124">记录与补账：解耦不等于无限积压</text><text x="635" y="784" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="629 733 532 124">在途必要记录及终态先预留空间/信用</text><text x="635" y="808" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="629 733 532 124">有界缓冲，必要记录与可采样遥测分开</text><text x="635" y="832" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="629 733 532 124">低余量限制新增；恢复后限速补账</text><rect x="30" y="910" width="1140" height="75" rx="4" fill="#faeee4" stroke="#a45a35" stroke-width="1.4"/><text x="46" y="939" font-size="18" fill="#a45a35" font-weight="500" text-anchor="start">关键依赖逐个填写：可信旧状态、允许操作、预算/时间上限、退出条件。</text><text x="46" y="965" font-size="15" fill="#64747b" font-weight="400" text-anchor="start">鉴权、额度、路由、计量的失败策略分开设计；不能统一“依赖失败就放行”。</text><text x="30" y="1021" font-size="13" fill="#64747b" font-weight="400" text-anchor="start">作者参考设计 / 教学假设 · 各机制需按实际实现验证 · 不构成厂商部署、事故或服务承诺声明</text></svg>
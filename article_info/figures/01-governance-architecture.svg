<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="985" viewBox="0 0 1200 985" role="img" aria-labelledby="title desc"><title id="title">五个治理域，共用一条可验证的请求链</title><desc id="desc">前两行是请求主链，其余是横向治理职责；交接按实现启用，不代表厂商生产拓扑。。作者参考设计或假设场景，不代表任何厂商生产拓扑、事故或能力评价。</desc><defs><marker id="arr-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183246"/></marker><marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64747b"/></marker><marker id="arr-paper" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7f6f0"/></marker><marker id="arr-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d4ddd8"/></marker><marker id="arr-D1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#246f64"/></marker><marker id="arr-D2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#356888"/></marker><marker id="arr-D3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6e7942"/></marker><marker id="arr-D4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45a35"/></marker><marker id="arr-D5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#795e7b"/></marker><marker id="arr-p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf3ee"/></marker><marker id="arr-p2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf0f5"/></marker><marker id="arr-p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f0f1e5"/></marker><marker id="arr-p4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#faeee4"/></marker><marker id="arr-p5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1eaf2"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b44935"/></marker><marker id="arr-white" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fffef9"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}svg{background:#f7f6f0}</style><rect x="0" y="0" width="1200" height="985" rx="0" fill="#f7f6f0" stroke="#f7f6f0" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="94" rx="0" fill="#183246" stroke="#183246" stroke-width="1.4"/><text x="30" y="33" font-size="13" fill="#b9cbc9" font-weight="400" text-anchor="start">FIG. 01 / RELIABILITY ARCHITECTURE</text><text x="30" y="69" font-size="27" fill="#fffef9" font-weight="500" text-anchor="start">五个治理域，共用一条可验证的请求链</text><text x="30" y="120" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">前两行是请求主链，其余是横向治理职责；交接按实现启用，不代表厂商生产拓扑。</text><rect x="25" y="145" width="1150" height="140" rx="5" fill="#eaf3ee" stroke="#246f64" stroke-width="1.4"/><text x="42" y="170" font-size="18" fill="#246f64" font-weight="500" text-anchor="start">入口与工作量：接什么、等多久、谁优先</text><rect x="42" y="186" width="260" height="81" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="57" y="217" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="51 194 242 65">调用方 / 任务身份</text><text x="57" y="245" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="51 194 242 65">期限、能力与重试标记</text><path d="M302 226 L325 226" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><rect x="327" y="186" width="260" height="81" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="342" y="217" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="336 194 242 65">API / 契约检查</text><text x="342" y="245" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="336 194 242 65">租户、参数、等级</text><path d="M587 226 L610 226" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><rect x="612" y="186" width="260" height="81" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="627" y="217" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="621 194 242 65">多资源准入</text><text x="627" y="245" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="621 194 242 65">速率预算 + 占用租约</text><path d="M872 226 L895 226" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><rect x="897" y="186" width="260" height="81" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="912" y="217" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="906 194 242 65">公平有界队列</text><text x="912" y="245" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="906 194 242 65">过期任务不再下发</text><rect x="25" y="305" width="1150" height="145" rx="5" fill="#eaf0f5" stroke="#356888" stroke-width="1.4"/><text x="42" y="330" font-size="18" fill="#356888" font-weight="500" text-anchor="start">推理与通信：算得慢，还是等得久</text><rect x="42" y="346" width="260" height="81" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="57" y="377" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="51 354 242 65">输入 / 编码 / Prefill</text><text x="57" y="405" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="51 354 242 65">长输入、图片等分支</text><path d="M302 386 L325 386" fill="none" stroke="#356888" stroke-width="2.2" marker-end="url(#arr-D2)"/><rect x="327" y="346" width="260" height="81" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="342" y="377" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="336 354 242 65">状态交接（可选）</text><text x="342" y="405" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="336 354 242 65">传输、确认、兼容</text><path d="M587 386 L610 386" fill="none" stroke="#356888" stroke-width="2.2" marker-end="url(#arr-D2)"/><rect x="612" y="346" width="260" height="81" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="627" y="377" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="621 354 242 65">Decode / 生成</text><text x="627" y="405" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="621 354 242 65">活动序列、步进</text><path d="M872 386 L895 386" fill="none" stroke="#356888" stroke-width="2.2" marker-end="url(#arr-D2)"/><rect x="897" y="346" width="260" height="81" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="912" y="377" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="906 354 242 65">协议输出</text><text x="912" y="405" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="906 354 242 65">流事件、明确终态</text><rect x="25" y="470" width="1150" height="135" rx="5" fill="#f0f1e5" stroke="#6e7942" stroke-width="1.4"/><text x="42" y="495" font-size="18" fill="#6e7942" font-weight="500" text-anchor="start">缓存与状态：谁持有、谁能输出、何时释放</text><rect x="42" y="511" width="260" height="81" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="57" y="542" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="51 519 242 65">前缀 / 缓存层级</text><text x="57" y="570" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="51 519 242 65">复用、冷态与重算</text><rect x="327" y="511" width="260" height="81" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="342" y="542" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="336 519 242 65">执行状态 / 所有权</text><text x="342" y="570" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="336 519 242 65">attempt、owner epoch</text><rect x="612" y="511" width="260" height="81" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="627" y="542" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="621 519 242 65">取消 / 幂等清理</text><text x="627" y="570" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="621 519 242 65">中止确认、释放证明</text><rect x="897" y="511" width="260" height="81" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="912" y="542" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="906 519 242 65">业务动作边界</text><text x="912" y="570" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="906 519 242 65">提交查询、动作幂等</text><rect x="25" y="625" width="1150" height="130" rx="5" fill="#faeee4" stroke="#a45a35" stroke-width="1.4"/><text x="42" y="650" font-size="18" fill="#a45a35" font-weight="500" text-anchor="start">容量与故障域：完整单元、真实余量、可信路由</text><rect x="42" y="666" width="260" height="81" rx="7" fill="#fffef9" stroke="#a45a35" stroke-width="1.4"/><text x="57" y="697" font-size="19" fill="#a45a35" font-weight="500" text-anchor="start" data-fit="51 674 242 65">完整服务单元</text><text x="57" y="725" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="51 674 242 65">模型、卡组与共同依赖</text><rect x="327" y="666" width="260" height="81" rx="7" fill="#fffef9" stroke="#a45a35" stroke-width="1.4"/><text x="342" y="697" font-size="19" fill="#a45a35" font-weight="500" text-anchor="start" data-fit="336 674 242 65">容量视图 / 就绪</text><text x="342" y="725" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="336 674 242 65">冷暖曲线、版本</text><rect x="612" y="666" width="260" height="81" rx="7" fill="#fffef9" stroke="#a45a35" stroke-width="1.4"/><text x="627" y="697" font-size="19" fill="#a45a35" font-weight="500" text-anchor="start" data-fit="621 674 242 65">选路 / 隔离</text><text x="627" y="725" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="621 674 242 65">新代际、坏目标退出</text><rect x="897" y="666" width="260" height="81" rx="7" fill="#fffef9" stroke="#a45a35" stroke-width="1.4"/><text x="912" y="697" font-size="19" fill="#a45a35" font-weight="500" text-anchor="start" data-fit="906 674 242 65">恢复 / 预算</text><text x="912" y="725" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="906 674 242 65">迁移、预热也要扣减</text><rect x="25" y="775" width="1150" height="125" rx="5" fill="#f1eaf2" stroke="#795e7b" stroke-width="1.4"/><text x="42" y="800" font-size="18" fill="#795e7b" font-weight="500" text-anchor="start">发布与结果：版本兼容、逐级放量、验收回退</text><rect x="42" y="816" width="260" height="81" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="57" y="847" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="51 824 242 65">兼容发布单元</text><text x="57" y="875" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="51 824 242 65">权重、模板、内核等</text><rect x="327" y="816" width="260" height="81" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="342" y="847" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="336 824 242 65">影子 / 金丝雀</text><text x="342" y="875" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="336 824 242 65">任务族、长尾生命周期</text><rect x="612" y="816" width="260" height="81" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="627" y="847" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="621 824 242 65">排空 / 受限迁移</text><text x="627" y="875" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="621 824 242 65">先摘流，后退出</text><rect x="897" y="816" width="260" height="81" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="912" y="847" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="906 824 242 65">完成 / 质量验收</text><text x="912" y="875" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="906 824 242 65">技术与任务分开</text><path d="M1027 267 L1027 295 L15 295 L15 386 L39 386" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><text x="45" y="936" font-size="19" fill="#183246" font-weight="500" text-anchor="start">贯穿能力：SLO / 因果观测 / 故障演练 / 责任人与整改证据</text><text x="30" y="966" font-size="13" fill="#64747b" font-weight="400" text-anchor="start">作者参考设计 / 教学假设 · 各机制需按实际实现验证 · 不构成厂商部署、事故或服务承诺声明</text></svg>
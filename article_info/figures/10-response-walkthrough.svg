<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc"><title id="title">一次完整处置：每一步都要有证据和继续条件</title><desc id="desc">作者假设场景与预案顺序；阶段编号不是固定恢复时长，不构成真实事故或实测记录。。作者参考设计或假设场景，不代表任何厂商生产拓扑、事故或能力评价。</desc><defs><marker id="arr-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183246"/></marker><marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64747b"/></marker><marker id="arr-paper" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7f6f0"/></marker><marker id="arr-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d4ddd8"/></marker><marker id="arr-D1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#246f64"/></marker><marker id="arr-D2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#356888"/></marker><marker id="arr-D3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6e7942"/></marker><marker id="arr-D4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45a35"/></marker><marker id="arr-D5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#795e7b"/></marker><marker id="arr-p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf3ee"/></marker><marker id="arr-p2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf0f5"/></marker><marker id="arr-p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f0f1e5"/></marker><marker id="arr-p4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#faeee4"/></marker><marker id="arr-p5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1eaf2"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b44935"/></marker><marker id="arr-white" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fffef9"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}svg{background:#f7f6f0}</style><rect x="0" y="0" width="1200" height="1110" rx="0" fill="#f7f6f0" stroke="#f7f6f0" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="94" rx="0" fill="#183246" stroke="#183246" stroke-width="1.4"/><text x="30" y="33" font-size="13" fill="#b9cbc9" font-weight="400" text-anchor="start">FIG. 10 / RELIABILITY ARCHITECTURE</text><text x="30" y="69" font-size="27" fill="#fffef9" font-weight="500" text-anchor="start">一次完整处置：每一步都要有证据和继续条件</text><text x="30" y="120" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">作者假设场景与预案顺序；阶段编号不是固定恢复时长，不构成真实事故或实测记录。</text><rect x="30" y="155" width="180" height="50" rx="0" fill="#183246" stroke="#f7f6f0" stroke-width="1.4"/><text x="44" y="187" font-size="18" fill="#fffef9" font-weight="500" text-anchor="start">阶段</text><rect x="210" y="155" width="455" height="50" rx="0" fill="#183246" stroke="#f7f6f0" stroke-width="1.4"/><text x="224" y="187" font-size="18" fill="#fffef9" font-weight="500" text-anchor="start">先拿到的证据</text><rect x="665" y="155" width="505" height="50" rx="0" fill="#183246" stroke="#f7f6f0" stroke-width="1.4"/><text x="679" y="187" font-size="18" fill="#fffef9" font-weight="500" text-anchor="start">动作与继续条件</text><rect x="30" y="205" width="180" height="125" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><rect x="210" y="205" width="455" height="125" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><rect x="665" y="205" width="505" height="125" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><text x="44" y="245" font-size="20" fill="#356888" font-weight="500" text-anchor="start">01 发现</text><text x="44" y="281" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">影响范围</text><text x="224" y="247" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="220 215 435 105">原始请求率与尝试率分开</text><text x="224" y="278" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="220 215 435 105">队列年龄 / 首输出 / 完整结束</text><text x="679" y="247" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="675 215 485 105">确定租户、模型、版本与任务族</text><text x="679" y="278" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="675 215 485 105">拒绝与服务诱发取消仍保留统计</text><rect x="30" y="330" width="180" height="125" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><rect x="210" y="330" width="455" height="125" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><rect x="665" y="330" width="505" height="125" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><text x="44" y="370" font-size="20" fill="#356888" font-weight="500" text-anchor="start">02 证伪</text><text x="44" y="406" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">隔离范围</text><text x="224" y="372" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="220 340 435 105">直接推理 vs 正常路由</text><text x="224" y="403" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="220 340 435 105">同长度 / 同冷热 / 执行进度</text><text x="679" y="372" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="675 340 485 105">先排除共享依赖和交接缺口</text><text x="679" y="403" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="675 340 485 105">已证实最小安全域再隔离</text><rect x="30" y="455" width="180" height="125" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><rect x="210" y="455" width="455" height="125" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><rect x="665" y="455" width="505" height="125" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><text x="44" y="495" font-size="20" fill="#356888" font-weight="500" text-anchor="start">03 止血</text><text x="44" y="531" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">统一扣账</text><text x="224" y="497" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="220 465 435 105">三冷态单元：预算 147</text><text x="224" y="528" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="220 465 435 105">新旧额度、状态占用共同核对</text><text x="679" y="497" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="675 465 485 105">原始 140 + 额外 ≤7，内部工作另扣</text><text x="679" y="528" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="675 465 485 105">承诺未排空时，可能需要更低准入</text><rect x="30" y="580" width="180" height="125" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><rect x="210" y="580" width="455" height="125" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><rect x="665" y="580" width="505" height="125" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><text x="44" y="620" font-size="20" fill="#356888" font-weight="500" text-anchor="start">04 排空修复</text><text x="44" y="656" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">状态收敛</text><text x="224" y="622" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="220 590 435 105">队列斜率、实际占用与旧代际</text><text x="224" y="653" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="220 590 435 105">源/目标/计量的未知项</text><text x="679" y="622" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="675 590 485 105">修复并限速重放，确认中止/回收</text><text x="679" y="653" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="675 590 485 105">不清空未知账本，不全量重算</text><rect x="30" y="705" width="180" height="125" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><rect x="210" y="705" width="455" height="125" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><rect x="665" y="705" width="505" height="125" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><text x="44" y="745" font-size="20" fill="#356888" font-weight="500" text-anchor="start">05 就绪验证</text><text x="44" y="781" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">恢复能力</text><text x="224" y="747" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="220 715 435 105">模型、通信、状态、探针已就绪</text><text x="224" y="778" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="220 715 435 105">四单元仍冷：196 &lt; 原始 200</text><text x="679" y="747" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="675 715 485 105">探针与预热也要扣预算</text><text x="679" y="778" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="675 715 485 105">按任务族验证，不能立即全量接回</text><rect x="30" y="830" width="180" height="125" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><rect x="210" y="830" width="455" height="125" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><rect x="665" y="830" width="505" height="125" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><text x="44" y="870" font-size="20" fill="#356888" font-weight="500" text-anchor="start">06 放量验收</text><text x="44" y="906" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">有退回门</text><text x="224" y="872" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="220 840 435 105">首输出/持续输出/终态及依赖</text><text x="224" y="903" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="220 840 435 105">观察窗覆盖约定任务生命周期</text><text x="679" y="872" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="675 840 485 105">分批增量；退化即停，过载退回预算</text><text x="679" y="903" font-size="17" fill="#183246" font-weight="400" text-anchor="start" data-fit="675 840 485 105">核对新请求、在途、资源和动作计量</text><rect x="30" y="985" width="1140" height="75" rx="4" fill="#faeee4" stroke="#a45a35" stroke-width="1.4"/><text x="46" y="1014" font-size="18" fill="#a45a35" font-weight="500" text-anchor="start">教学推演：240 次外部尝试若全部派发，超过三冷态单元 210 的实测上界。</text><text x="46" y="1040" font-size="15" fill="#64747b" font-weight="400" text-anchor="start">规划预算 147 仍要扣内部恢复工作；数字依同分布成本假设，真实准入逐维验证。</text><text x="30" y="1091" font-size="13" fill="#64747b" font-weight="400" text-anchor="start">作者参考设计 / 教学假设 · 各机制需按实际实现验证 · 不构成厂商部署、事故或服务承诺声明</text></svg>
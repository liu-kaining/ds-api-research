<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">成功率应越过 HTTP 200，仍要保留责任边界</title><desc id="desc">任务质量、协议正确性、技术可用性分别观测；“已结束”与“结果可使用”分开判断。。作者参考设计或假设场景，不代表任何厂商生产拓扑、事故或能力评价。</desc><defs><marker id="arr-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183246"/></marker><marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64747b"/></marker><marker id="arr-paper" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7f6f0"/></marker><marker id="arr-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d4ddd8"/></marker><marker id="arr-D1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#246f64"/></marker><marker id="arr-D2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#356888"/></marker><marker id="arr-D3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6e7942"/></marker><marker id="arr-D4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45a35"/></marker><marker id="arr-D5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#795e7b"/></marker><marker id="arr-p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf3ee"/></marker><marker id="arr-p2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf0f5"/></marker><marker id="arr-p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f0f1e5"/></marker><marker id="arr-p4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#faeee4"/></marker><marker id="arr-p5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1eaf2"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b44935"/></marker><marker id="arr-white" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fffef9"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}svg{background:#f7f6f0}</style><rect x="0" y="0" width="1200" height="830" rx="0" fill="#f7f6f0" stroke="#f7f6f0" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="94" rx="0" fill="#183246" stroke="#183246" stroke-width="1.4"/><text x="30" y="33" font-size="13" fill="#b9cbc9" font-weight="400" text-anchor="start">FIG. 08 / RELIABILITY ARCHITECTURE</text><text x="30" y="69" font-size="27" fill="#fffef9" font-weight="500" text-anchor="start">成功率应越过 HTTP 200，仍要保留责任边界</text><text x="30" y="120" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">任务质量、协议正确性、技术可用性分别观测；“已结束”与“结果可使用”分开判断。</text><rect x="30" y="180" width="330" height="135" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="45" y="211" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="39 188 312 119">传输完整</text><text x="45" y="239" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 188 312 119">未意外 EOF</text><text x="45" y="263" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 188 312 119">有匹配端点的结束证据</text><rect x="435" y="180" width="330" height="135" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="450" y="211" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="444 188 312 119">协议可用</text><text x="450" y="239" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="444 188 312 119">终态分类 / schema</text><text x="450" y="263" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="444 188 312 119">工具参数和消息合法</text><rect x="840" y="180" width="330" height="135" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="855" y="211" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="849 188 312 119">任务完成</text><text x="855" y="239" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="849 188 312 119">约定结果与流程达成</text><text x="855" y="263" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="849 188 312 119">业务动作状态可核对</text><path d="M360 247 L431 247" fill="none" stroke="#183246" stroke-width="2.2" marker-end="url(#arr-ink)"/><path d="M765 247 L836 247" fill="none" stroke="#183246" stroke-width="2.2" marker-end="url(#arr-ink)"/><text x="45" y="355" font-size="17" fill="#64747b" font-weight="400" text-anchor="start">服务方与调用方按边界协作；不能把调用方业务结果全归为模型平台可用性。</text><rect x="30" y="410" width="555" height="95" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="45" y="441" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="39 418 537 79">完整成功</text><text x="45" y="469" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 418 537 79">传输、协议与本等级条件满足</text><rect x="615" y="410" width="555" height="95" rx="7" fill="#fffef9" stroke="#a45a35" stroke-width="1.4"/><text x="630" y="441" font-size="19" fill="#a45a35" font-weight="500" text-anchor="start" data-fit="624 418 537 79">部分 / 中断</text><text x="630" y="469" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="624 418 537 79">内容已可见，但任务未确认完成</text><rect x="30" y="525" width="555" height="95" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="45" y="556" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="39 533 537 79">预算 / 策略终止</text><text x="45" y="584" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 533 537 79">length、过滤等按契约单列</text><rect x="615" y="525" width="555" height="95" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="630" y="556" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="624 533 537 79">系统 / 协议异常</text><text x="630" y="584" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="624 533 537 79">资源失败、非法终态、解析异常</text><rect x="30" y="700" width="1140" height="75" rx="4" fill="#eaf3ee" stroke="#246f64" stroke-width="1.4"/><text x="46" y="729" font-size="18" fill="#246f64" font-weight="500" text-anchor="start">同一合格原始请求集合：首输出达标 ∩ 持续输出达标 ∩ 约定完整结束。</text><text x="46" y="755" font-size="15" fill="#64747b" font-weight="400" text-anchor="start">尝试层和业务任务层分开统计；服务诱发取消与过载拒绝不因结果难看而消失。</text><text x="30" y="811" font-size="13" fill="#64747b" font-weight="400" text-anchor="start">作者参考设计 / 教学假设 · 各机制需按实际实现验证 · 不构成厂商部署、事故或服务承诺声明</text></svg>
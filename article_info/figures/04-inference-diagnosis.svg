<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">先区分“算得慢”“等得久”和“结果不可用”</title><desc id="desc">这些是候选分支，不是根因断言；选恢复动作前保留能证伪的对照。。作者参考设计或假设场景，不代表任何厂商生产拓扑、事故或能力评价。</desc><defs><marker id="arr-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183246"/></marker><marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64747b"/></marker><marker id="arr-paper" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7f6f0"/></marker><marker id="arr-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d4ddd8"/></marker><marker id="arr-D1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#246f64"/></marker><marker id="arr-D2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#356888"/></marker><marker id="arr-D3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6e7942"/></marker><marker id="arr-D4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45a35"/></marker><marker id="arr-D5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#795e7b"/></marker><marker id="arr-p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf3ee"/></marker><marker id="arr-p2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf0f5"/></marker><marker id="arr-p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f0f1e5"/></marker><marker id="arr-p4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#faeee4"/></marker><marker id="arr-p5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1eaf2"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b44935"/></marker><marker id="arr-white" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fffef9"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}svg{background:#f7f6f0}</style><rect x="0" y="0" width="1200" height="850" rx="0" fill="#f7f6f0" stroke="#f7f6f0" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="94" rx="0" fill="#183246" stroke="#183246" stroke-width="1.4"/><text x="30" y="33" font-size="13" fill="#b9cbc9" font-weight="400" text-anchor="start">FIG. 04 / RELIABILITY ARCHITECTURE</text><text x="30" y="69" font-size="27" fill="#fffef9" font-weight="500" text-anchor="start">先区分“算得慢”“等得久”和“结果不可用”</text><text x="30" y="120" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">这些是候选分支，不是根因断言；选恢复动作前保留能证伪的对照。</text><rect x="30" y="150" width="210" height="53" rx="0" fill="#183246" stroke="#f7f6f0" stroke-width="1.4"/><text x="42" y="183" font-size="18" fill="#fffef9" font-weight="500" text-anchor="start">用户表象</text><rect x="240" y="150" width="310" height="53" rx="0" fill="#183246" stroke="#f7f6f0" stroke-width="1.4"/><text x="252" y="183" font-size="18" fill="#fffef9" font-weight="500" text-anchor="start">先拆哪个时间段</text><rect x="550" y="150" width="330" height="53" rx="0" fill="#183246" stroke="#f7f6f0" stroke-width="1.4"/><text x="562" y="183" font-size="18" fill="#fffef9" font-weight="500" text-anchor="start">能区分原因的证据</text><rect x="880" y="150" width="290" height="53" rx="0" fill="#183246" stroke="#f7f6f0" stroke-width="1.4"/><text x="892" y="183" font-size="18" fill="#fffef9" font-weight="500" text-anchor="start">先做的恢复动作</text><rect x="30" y="203" width="210" height="120" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><rect x="240" y="203" width="310" height="120" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><rect x="550" y="203" width="330" height="120" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><rect x="880" y="203" width="290" height="120" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><text x="42" y="245" font-size="19" fill="#356888" font-weight="500" text-anchor="start">首输出慢</text><text x="252" y="243" font-size="16" fill="#183246" font-weight="400" text-anchor="start">编码 / 队列 / Prefill</text><text x="252" y="271" font-size="16" fill="#183246" font-weight="400" text-anchor="start">视觉 / 编译 / 交接</text><text x="562" y="243" font-size="16" fill="#183246" font-weight="400" text-anchor="start">未缓存工作、CPU、阶段 span</text><text x="562" y="271" font-size="16" fill="#183246" font-weight="400" text-anchor="start">同长度 + 同冷热状态对照</text><text x="892" y="243" font-size="16" fill="#183246" font-weight="400" text-anchor="start">限制重工作 / 恢复对应池</text><text x="892" y="271" font-size="16" fill="#183246" font-weight="400" text-anchor="start">查交接或 Decode 排队</text><rect x="30" y="323" width="210" height="120" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><rect x="240" y="323" width="310" height="120" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><rect x="550" y="323" width="330" height="120" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><rect x="880" y="323" width="290" height="120" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><text x="42" y="365" font-size="19" fill="#356888" font-weight="500" text-anchor="start">输出越来越卡</text><text x="252" y="363" font-size="16" fill="#183246" font-weight="400" text-anchor="start">引擎步时 / 专家通信</text><text x="252" y="391" font-size="16" fill="#183246" font-weight="400" text-anchor="start">代理 / 客户端事件</text><text x="562" y="363" font-size="16" fill="#183246" font-weight="400" text-anchor="start">最慢 rank、活动序列</text><text x="562" y="391" font-size="16" fill="#183246" font-weight="400" text-anchor="start">引擎 Token 与 chunk 分开</text><text x="892" y="363" font-size="16" fill="#183246" font-weight="400" text-anchor="start">保护在途、收紧长生成</text><text x="892" y="391" font-size="16" fill="#183246" font-weight="400" text-anchor="start">定位热点或坏路径再隔离</text><rect x="30" y="443" width="210" height="120" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><rect x="240" y="443" width="310" height="120" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><rect x="550" y="443" width="330" height="120" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><rect x="880" y="443" width="290" height="120" rx="0" fill="#fffef9" stroke="#d4ddd8" stroke-width="1.4"/><text x="42" y="485" font-size="19" fill="#356888" font-weight="500" text-anchor="start">整组没有进展</text><text x="252" y="483" font-size="16" fill="#183246" font-weight="400" text-anchor="start">执行进度 / 成员故障</text><text x="252" y="511" font-size="16" fill="#183246" font-weight="400" text-anchor="start">发现视图 / 实际就绪</text><text x="562" y="483" font-size="16" fill="#183246" font-weight="400" text-anchor="start">实例域关联、Xid/RAS</text><text x="562" y="511" font-size="16" fill="#183246" font-weight="400" text-anchor="start">直接推理与经路由对照</text><text x="892" y="483" font-size="16" fill="#183246" font-weight="400" text-anchor="start">隔离最小安全域</text><text x="892" y="511" font-size="16" fill="#183246" font-weight="400" text-anchor="start">无局部恢复能力才重建</text><rect x="30" y="563" width="210" height="120" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><rect x="240" y="563" width="310" height="120" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><rect x="550" y="563" width="330" height="120" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><rect x="880" y="563" width="290" height="120" rx="0" fill="#eaf0f5" stroke="#d4ddd8" stroke-width="1.4"/><text x="42" y="605" font-size="19" fill="#356888" font-weight="500" text-anchor="start">200 但任务失败</text><text x="252" y="603" font-size="16" fill="#183246" font-weight="400" text-anchor="start">终态 / schema / 工具</text><text x="252" y="631" font-size="16" fill="#183246" font-weight="400" text-anchor="start">适配器 / 模型版本</text><text x="562" y="603" font-size="16" fill="#183246" font-weight="400" text-anchor="start">结束原因、事件类型</text><text x="562" y="631" font-size="16" fill="#183246" font-weight="400" text-anchor="start">任务回放、外部动作账本</text><text x="892" y="603" font-size="16" fill="#183246" font-weight="400" text-anchor="start">区分预算/资源/协议结果</text><text x="892" y="631" font-size="16" fill="#183246" font-weight="400" text-anchor="start">暂停副作用，兼容回退</text><rect x="30" y="725" width="1140" height="75" rx="4" fill="#eaf0f5" stroke="#356888" stroke-width="1.4"/><text x="46" y="754" font-size="18" fill="#356888" font-weight="500" text-anchor="start">故障定位输出应包含：阶段 × 范围 × 版本 × 状态，而不只是一个错误码。</text><text x="46" y="780" font-size="15" fill="#64747b" font-weight="400" text-anchor="start">进程存活不能证明推理有进度；平均 GPU 利用率也不能排除慢成员或网络等待。</text><text x="30" y="831" font-size="13" fill="#64747b" font-weight="400" text-anchor="start">作者参考设计 / 教学假设 · 各机制需按实际实现验证 · 不构成厂商部署、事故或服务承诺声明</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">用证据组织一次架构反查，而不打主观成熟度分</title><desc id="desc">技术经理确定范围与优先级；各域责任人提交证据；SRE 组织独立验证和恢复演练。。作者参考设计或假设场景，不代表任何厂商生产拓扑、事故或能力评价。</desc><defs><marker id="arr-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183246"/></marker><marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64747b"/></marker><marker id="arr-paper" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7f6f0"/></marker><marker id="arr-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d4ddd8"/></marker><marker id="arr-D1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#246f64"/></marker><marker id="arr-D2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#356888"/></marker><marker id="arr-D3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6e7942"/></marker><marker id="arr-D4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45a35"/></marker><marker id="arr-D5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#795e7b"/></marker><marker id="arr-p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf3ee"/></marker><marker id="arr-p2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf0f5"/></marker><marker id="arr-p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f0f1e5"/></marker><marker id="arr-p4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#faeee4"/></marker><marker id="arr-p5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1eaf2"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b44935"/></marker><marker id="arr-white" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fffef9"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}svg{background:#f7f6f0}</style><rect x="0" y="0" width="1200" height="850" rx="0" fill="#f7f6f0" stroke="#f7f6f0" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="94" rx="0" fill="#183246" stroke="#183246" stroke-width="1.4"/><text x="30" y="33" font-size="13" fill="#b9cbc9" font-weight="400" text-anchor="start">FIG. 11 / RELIABILITY ARCHITECTURE</text><text x="30" y="69" font-size="27" fill="#fffef9" font-weight="500" text-anchor="start">用证据组织一次架构反查，而不打主观成熟度分</text><text x="30" y="120" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">技术经理确定范围与优先级；各域责任人提交证据；SRE 组织独立验证和恢复演练。</text><rect x="30" y="165" width="200" height="93" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="45" y="196" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="39 173 182 77">入口与负载</text><text x="45" y="224" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 173 182 77">D1 · 确认适用边界</text><path d="M130 258 L130 300 L600 300 L600 345" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><rect x="265" y="165" width="200" height="93" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="280" y="196" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="274 173 182 77">执行与通信</text><text x="280" y="224" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="274 173 182 77">D2 · 确认适用边界</text><path d="M365 258 L365 300 L600 300 L600 345" fill="none" stroke="#356888" stroke-width="2.2" marker-end="url(#arr-D2)"/><rect x="500" y="165" width="200" height="93" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="515" y="196" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="509 173 182 77">缓存与状态</text><text x="515" y="224" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="509 173 182 77">D3 · 确认适用边界</text><path d="M600 258 L600 300 L600 300 L600 345" fill="none" stroke="#6e7942" stroke-width="2.2" marker-end="url(#arr-D3)"/><rect x="735" y="165" width="200" height="93" rx="7" fill="#fffef9" stroke="#a45a35" stroke-width="1.4"/><text x="750" y="196" font-size="19" fill="#a45a35" font-weight="500" text-anchor="start" data-fit="744 173 182 77">容量与路由</text><text x="750" y="224" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="744 173 182 77">D4 · 确认适用边界</text><path d="M835 258 L835 300 L600 300 L600 345" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)"/><rect x="970" y="165" width="200" height="93" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="985" y="196" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="979 173 182 77">发布与结果</text><text x="985" y="224" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="979 173 182 77">D5 · 确认适用边界</text><path d="M1070 258 L1070 300 L600 300 L600 345" fill="none" stroke="#795e7b" stroke-width="2.2" marker-end="url(#arr-D5)"/><rect x="210" y="350" width="780" height="140" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="225" y="381" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="219 358 762 124">每个治理项都要填：场景 → 机制 → 证据 → 验收</text><text x="225" y="409" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="219 358 762 124">证据含：版本、工作负载、故障域、测量窗口、通过/未通过结果</text><text x="225" y="433" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="219 358 762 124">建议协作方不能代替明确唯一整改责任人；不适用必须说明原因</text><rect x="30" y="565" width="255" height="93" rx="7" fill="#fffef9" stroke="#a45a35" stroke-width="1.4"/><text x="45" y="596" font-size="19" fill="#a45a35" font-weight="500" text-anchor="start" data-fit="39 573 237 77">待核实</text><text x="45" y="624" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 573 237 77">缺少可审阅证据</text><rect x="325" y="565" width="255" height="93" rx="7" fill="#fffef9" stroke="#246f64" stroke-width="1.4"/><text x="340" y="596" font-size="19" fill="#246f64" font-weight="500" text-anchor="start" data-fit="334 573 237 77">已验证</text><text x="340" y="624" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="334 573 237 77">满足当前边界与验收</text><rect x="620" y="565" width="255" height="93" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="635" y="596" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="629 573 237 77">未通过</text><text x="635" y="624" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="629 573 237 77">有复现及改造项</text><rect x="915" y="565" width="255" height="93" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="930" y="596" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="924 573 237 77">不适用</text><text x="930" y="624" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="924 573 237 77">有范围与理由</text><path d="M600 490 L600 535 L155 535 L155 561" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)"/><path d="M600 490 L600 535 L450 535 L450 561" fill="none" stroke="#246f64" stroke-width="2.2" marker-end="url(#arr-D1)"/><path d="M600 490 L600 535 L745 535 L745 561" fill="none" stroke="#795e7b" stroke-width="2.2" marker-end="url(#arr-D5)"/><path d="M600 490 L600 535 L1040 535 L1040 561" fill="none" stroke="#356888" stroke-width="2.2" marker-end="url(#arr-D2)"/><rect x="30" y="715" width="1140" height="75" rx="4" fill="#eaf3ee" stroke="#246f64" stroke-width="1.4"/><text x="46" y="744" font-size="18" fill="#246f64" font-weight="500" text-anchor="start">整改闭环：责任人 + 期限 + 动作 + 停止条件 + 演练证据 + 下次复核条件。</text><text x="46" y="770" font-size="15" fill="#64747b" font-weight="400" text-anchor="start">缺少证据不是已证实事故；验证通过也不是永久有效，版本、流量或故障域变化后应复核。</text><text x="30" y="831" font-size="13" fill="#64747b" font-weight="400" text-anchor="start">作者参考设计 / 教学假设 · 各机制需按实际实现验证 · 不构成厂商部署、事故或服务承诺声明</text></svg>
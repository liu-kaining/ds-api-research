<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">请求结束，不等于所有状态已经收敛</title><desc id="desc">明确终态、取消链和资源释放分别验收；无续写契约时返回部分结果或新请求。。作者参考设计或假设场景，不代表任何厂商生产拓扑、事故或能力评价。</desc><defs><marker id="arr-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183246"/></marker><marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64747b"/></marker><marker id="arr-paper" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7f6f0"/></marker><marker id="arr-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d4ddd8"/></marker><marker id="arr-D1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#246f64"/></marker><marker id="arr-D2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#356888"/></marker><marker id="arr-D3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6e7942"/></marker><marker id="arr-D4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45a35"/></marker><marker id="arr-D5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#795e7b"/></marker><marker id="arr-p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf3ee"/></marker><marker id="arr-p2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf0f5"/></marker><marker id="arr-p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f0f1e5"/></marker><marker id="arr-p4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#faeee4"/></marker><marker id="arr-p5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1eaf2"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b44935"/></marker><marker id="arr-white" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fffef9"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}svg{background:#f7f6f0}</style><rect x="0" y="0" width="1200" height="830" rx="0" fill="#f7f6f0" stroke="#f7f6f0" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="94" rx="0" fill="#183246" stroke="#183246" stroke-width="1.4"/><text x="30" y="33" font-size="13" fill="#b9cbc9" font-weight="400" text-anchor="start">FIG. 02 / RELIABILITY ARCHITECTURE</text><text x="30" y="69" font-size="27" fill="#fffef9" font-weight="500" text-anchor="start">请求结束，不等于所有状态已经收敛</text><text x="30" y="120" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">明确终态、取消链和资源释放分别验收；无续写契约时返回部分结果或新请求。</text><rect x="30" y="175" width="200" height="105" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="45" y="206" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="39 183 182 89">已验证</text><text x="45" y="234" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="39 183 182 89">合格请求进入</text><path d="M230 227 L261 227" fill="none" stroke="#356888" stroke-width="2.2" marker-end="url(#arr-D2)"/><rect x="265" y="175" width="200" height="105" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="280" y="206" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="274 183 182 89">等待准入</text><text x="280" y="234" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="274 183 182 89">预算与 deadline</text><path d="M465 227 L496 227" fill="none" stroke="#356888" stroke-width="2.2" marker-end="url(#arr-D2)"/><rect x="500" y="175" width="200" height="105" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="515" y="206" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="509 183 182 89">正在执行</text><text x="515" y="234" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="509 183 182 89">当前有效 owner</text><path d="M700 227 L731 227" fill="none" stroke="#356888" stroke-width="2.2" marker-end="url(#arr-D2)"/><rect x="735" y="175" width="200" height="105" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="750" y="206" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="744 183 182 89">部分输出</text><text x="750" y="234" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="744 183 182 89">结果已对外可见</text><path d="M935 227 L966 227" fill="none" stroke="#356888" stroke-width="2.2" marker-end="url(#arr-D2)"/><rect x="970" y="175" width="200" height="105" rx="7" fill="#fffef9" stroke="#356888" stroke-width="1.4"/><text x="985" y="206" font-size="19" fill="#356888" font-weight="500" text-anchor="start" data-fit="979 183 182 89">明确终态</text><text x="985" y="234" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="979 183 182 89">成功 / 失败 / 部分</text><text x="33" y="155" font-size="17" fill="#356888" font-weight="500" text-anchor="start">服务端请求状态</text><rect x="190" y="420" width="260" height="110" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="205" y="451" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="199 428 242 94">取消已请求</text><text x="205" y="479" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="199 428 242 94">阻止新增派发 / 输出</text><rect x="490" y="420" width="260" height="110" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="505" y="451" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="499 428 242 94">执行已中止</text><text x="505" y="479" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="499 428 242 94">引擎确认，不只收信号</text><rect x="790" y="420" width="260" height="110" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="805" y="451" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="799 428 242 94">资源已回收</text><text x="805" y="479" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="799 428 242 94">旧引用、预留均收敛</text><path d="M450 475 L486 475" fill="none" stroke="#6e7942" stroke-width="2.2" marker-end="url(#arr-D3)"/><path d="M750 475 L786 475" fill="none" stroke="#6e7942" stroke-width="2.2" marker-end="url(#arr-D3)"/><path d="M365 280 L365 360 L320 360 L320 417" fill="none" stroke="#6e7942" stroke-width="2.2" marker-end="url(#arr-D3)"/><path d="M600 280 L600 345 L320 345 L320 417" fill="none" stroke="#6e7942" stroke-width="2.2" marker-end="url(#arr-D3)"/><path d="M835 280 L835 330 L320 330 L320 417" fill="none" stroke="#6e7942" stroke-width="2.2" marker-end="url(#arr-D3)"/><text x="40" y="329" font-size="16" fill="#6e7942" font-weight="400" text-anchor="start">deadline 到期 / 断开 / 主动取消</text><path d="M1030 280 L1140 280 L1140 610 L1060 610" fill="none" stroke="#795e7b" stroke-width="2.2" marker-end="url(#arr-D5)" stroke-dasharray="7 5"/><rect x="790" y="570" width="270" height="93" rx="7" fill="#fffef9" stroke="#795e7b" stroke-width="1.4"/><text x="805" y="601" font-size="19" fill="#795e7b" font-weight="500" text-anchor="start" data-fit="799 578 252 77">终态后仍需核对</text><text x="805" y="629" font-size="16" fill="#64747b" font-weight="400" text-anchor="start" data-fit="799 578 252 77">业务动作 / 计量的独立状态</text><rect x="30" y="700" width="1140" height="75" rx="4" fill="#f0f1e5" stroke="#6e7942" stroke-width="1.4"/><text x="46" y="729" font-size="18" fill="#6e7942" font-weight="500" text-anchor="start">三个不能混用的身份：业务任务 ID、API 请求 ID、执行尝试 ID。</text><text x="46" y="755" font-size="15" fill="#64747b" font-weight="400" text-anchor="start">取消请求不等于已停止；单一有效执行者也不自动保证客户端恰好一次收到事件。</text><text x="30" y="811" font-size="13" fill="#64747b" font-weight="400" text-anchor="start">作者参考设计 / 教学假设 · 各机制需按实际实现验证 · 不构成厂商部署、事故或服务承诺声明</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">交接、取消与迟到消息：把所有权画到时序里</title><desc id="desc">作者建议的最小协议约束；attempt、transfer、worker incarnation 和业务动作身份分别管理。。作者参考设计或假设场景，不代表任何厂商生产拓扑、事故或能力评价。</desc><defs><marker id="arr-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#183246"/></marker><marker id="arr-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64747b"/></marker><marker id="arr-paper" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f7f6f0"/></marker><marker id="arr-line" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d4ddd8"/></marker><marker id="arr-D1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#246f64"/></marker><marker id="arr-D2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#356888"/></marker><marker id="arr-D3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6e7942"/></marker><marker id="arr-D4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a45a35"/></marker><marker id="arr-D5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#795e7b"/></marker><marker id="arr-p1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf3ee"/></marker><marker id="arr-p2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eaf0f5"/></marker><marker id="arr-p3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f0f1e5"/></marker><marker id="arr-p4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#faeee4"/></marker><marker id="arr-p5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#f1eaf2"/></marker><marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#b44935"/></marker><marker id="arr-white" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#fffef9"/></marker></defs><style>text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}svg{background:#f7f6f0}</style><rect x="0" y="0" width="1200" height="950" rx="0" fill="#f7f6f0" stroke="#f7f6f0" stroke-width="1.4"/><rect x="0" y="0" width="1200" height="94" rx="0" fill="#183246" stroke="#183246" stroke-width="1.4"/><text x="30" y="33" font-size="13" fill="#b9cbc9" font-weight="400" text-anchor="start">FIG. 05 / RELIABILITY ARCHITECTURE</text><text x="30" y="69" font-size="27" fill="#fffef9" font-weight="500" text-anchor="start">交接、取消与迟到消息：把所有权画到时序里</text><text x="30" y="120" font-size="16" fill="#64747b" font-weight="400" text-anchor="start">作者建议的最小协议约束；attempt、transfer、worker incarnation 和业务动作身份分别管理。</text><rect x="35" y="145" width="230" height="66" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="50" y="176" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="44 153 212 50">入口 / 调度</text><path d="M150 211 V785" stroke="#d4ddd8" stroke-width="2" stroke-dasharray="5 6"/><rect x="335" y="145" width="230" height="66" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="350" y="176" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="344 153 212 50">Prefill</text><path d="M450 211 V785" stroke="#d4ddd8" stroke-width="2" stroke-dasharray="5 6"/><rect x="635" y="145" width="230" height="66" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="650" y="176" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="644 153 212 50">Decode</text><path d="M750 211 V785" stroke="#d4ddd8" stroke-width="2" stroke-dasharray="5 6"/><rect x="935" y="145" width="230" height="66" rx="7" fill="#fffef9" stroke="#6e7942" stroke-width="1.4"/><text x="950" y="176" font-size="19" fill="#6e7942" font-weight="500" text-anchor="start" data-fit="944 153 212 50">状态账本</text><path d="M1050 211 V785" stroke="#d4ddd8" stroke-width="2" stroke-dasharray="5 6"/><path d="M150 270 L450 270" fill="none" stroke="#6e7942" stroke-width="2.2" marker-end="url(#arr-D3)"/><text x="300.0" y="260" font-size="16" fill="#6e7942" font-weight="400" text-anchor="middle">请求 a7 / owner epoch=12</text><path d="M450 345 L750 345" fill="none" stroke="#6e7942" stroke-width="2.2" marker-end="url(#arr-D3)"/><text x="600.0" y="335" font-size="16" fill="#6e7942" font-weight="400" text-anchor="middle">交接 t4，绑定 a7 与有效代际</text><path d="M150 420 L750 420" fill="none" stroke="#a45a35" stroke-width="2.2" marker-end="url(#arr-D4)"/><text x="450.0" y="410" font-size="16" fill="#a45a35" font-weight="400" text-anchor="middle">取消 a7：停止新输出与子任务</text><path d="M750 490 L1050 490" fill="none" stroke="#6e7942" stroke-width="2.2" marker-end="url(#arr-D3)"/><text x="900.0" y="480" font-size="16" fill="#6e7942" font-weight="400" text-anchor="middle">确认中止 / fencing / 释放引用</text><path d="M450 565 L750 565" fill="none" stroke="#b44935" stroke-width="2.2" marker-end="url(#arr-red)" stroke-dasharray="7 5"/><text x="600.0" y="555" font-size="16" fill="#b44935" font-weight="400" text-anchor="middle">迟到的 t4 / 旧代际确认</text><text x="778" y="571" font-size="17" fill="#b44935" font-weight="500" text-anchor="start">× 拒绝重新激活旧尝试</text><path d="M750 640 L150 640" fill="none" stroke="#6e7942" stroke-width="2.2" marker-end="url(#arr-D3)"/><text x="450.0" y="630" font-size="16" fill="#6e7942" font-weight="400" text-anchor="middle">abort + release 证据返回</text><path d="M1050 715 L450 715" fill="none" stroke="#6e7942" stroke-width="2.2" marker-end="url(#arr-D3)"/><text x="750.0" y="705" font-size="16" fill="#6e7942" font-weight="400" text-anchor="middle">重复清理只作用于旧引用，不误删新状态</text><rect x="30" y="820" width="1140" height="75" rx="4" fill="#f0f1e5" stroke="#6e7942" stroke-width="1.4"/><text x="46" y="849" font-size="18" fill="#6e7942" font-weight="500" text-anchor="start">不变量：一个有效发布者；旧代际不再接管；清理可重入；释放有证据。</text><text x="46" y="875" font-size="15" fill="#64747b" font-weight="400" text-anchor="start">租约/TTL 不是万能证明。客户端恢复还需要端点支持、事件序号与明确消费位置。</text><text x="30" y="931" font-size="13" fill="#64747b" font-weight="400" text-anchor="start">作者参考设计 / 教学假设 · 各机制需按实际实现验证 · 不构成厂商部署、事故或服务承诺声明</text></svg>